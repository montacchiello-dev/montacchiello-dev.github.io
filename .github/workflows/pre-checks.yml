name: pre-checks

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/pre-commit@v18.27.0
        with:
          auto-commit: "false"
